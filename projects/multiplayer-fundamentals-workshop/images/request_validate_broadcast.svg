<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Request, validate, broadcast</title>
  <desc id="desc">A client that touches another player while It sends request_tag to the server. The server checks that the sender is It, the target is in range, both players are alive and the cooldown is over. If any check fails the request is ignored. Otherwise the server sends apply_tag_result to every peer, and all peers update the It label, health bars and scores.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <g stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow)">
    <line x1="330" y1="92" x2="330" y2="149"/>
    <line x1="330" y1="284" x2="330" y2="341"/>
    <line x1="570" y1="218" x2="633" y2="218"/>
  </g>

  <g fill="#e4e4e4">
    <rect x="93" y="23" width="480" height="72" rx="8"/>
    <rect x="93" y="155" width="480" height="132" rx="8"/>
    <rect x="93" y="347" width="480" height="72" rx="8"/>
  </g>
  <g stroke-width="2">
    <rect x="90" y="20" width="480" height="72" rx="8" fill="#fff" stroke="#222"/>
    <rect x="90" y="152" width="480" height="132" rx="8" fill="#222" stroke="#222"/>
    <rect x="90" y="344" width="480" height="72" rx="8" fill="#fff" stroke="#222"/>
    <rect x="636" y="196" width="144" height="44" rx="8" fill="#fff" stroke="#9a9a9a" stroke-dasharray="5 4"/>
  </g>

  <g fill="#333" stroke="#555" stroke-width="1">
    <rect x="110" y="190" width="210" height="32" rx="6"/>
    <rect x="340" y="190" width="210" height="32" rx="6"/>
    <rect x="110" y="232" width="210" height="32" rx="6"/>
    <rect x="340" y="232" width="210" height="32" rx="6"/>
  </g>
  <circle cx="297" cy="172" r="4" fill="#e00"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" dominant-baseline="central">
    <g font-size="12" font-weight="700" letter-spacing="1.5">
      <text x="330" y="40" fill="#888">CLIENT</text>
      <text x="336" y="172" fill="#fff">SERVER</text>
      <text x="330" y="364" fill="#888">ALL PEERS</text>
    </g>

    <g font-size="16" fill="#222">
      <text x="330" y="66">touches another player while It</text>
      <text x="330" y="390">update "IT" label, health bars, scores</text>
    </g>

    <g font-size="14" fill="#eee">
      <text x="215" y="206">sender is It?</text>
      <text x="445" y="206">target in range?</text>
      <text x="215" y="248">both alive?</text>
      <text x="445" y="248">cooldown over?</text>
    </g>

    <text x="708" y="218" font-size="14" fill="#666">ignore request</text>
    <text x="601" y="204" font-size="13" font-weight="700" fill="#e00">no</text>

    <g text-anchor="start">
      <text x="346" y="112" font-size="14" font-weight="700" fill="#222">request_tag(target_id)</text>
      <text x="346" y="132" font-size="12" fill="#888">RPC &#183; client &#8594; server</text>
      <text x="346" y="304" font-size="14" font-weight="700" fill="#222"><tspan fill="#1f8a4c">yes</tspan> &#8594; apply_tag_result(tagger, target)</text>
      <text x="346" y="324" font-size="12" fill="#888">RPC &#183; server &#8594; everyone</text>
    </g>
  </g>
</svg>
