<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 996 442" width="100%" role="img">
<title>Own hardware ladder cascade</title>
<style>
  .lbl { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #171717; }
  .meta { font: 400 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5c5c5c; }
</style>
<defs>
  <pattern id="hatch-wait" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#adb5bd"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#495057" stroke-width="3"/>
  </pattern>
  <pattern id="hatch-code" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
    <rect width="8" height="8" fill="#ffd8a8"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#e8590c" stroke-width="3"/>
  </pattern>
</defs>
