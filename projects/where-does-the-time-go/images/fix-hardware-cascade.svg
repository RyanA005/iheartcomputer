<rect x="198" y="346" width="6" height="16" fill="#e9ecef"/>
<rect x="198.00" y="346.00" width="6.00" height="16" fill="url(#hatch-wait)" stroke="#495057" stroke-width="0.75"><title>to 0.01 ms</title></rect>
<rect x="204.00" y="346.00" width="6.00" height="16" fill="#0b57d0"><title>work 0.30 ms</title></rect>
<rect x="210.00" y="346.00" width="6.00" height="16" fill="url(#hatch-wait)" stroke="#495057" stroke-width="0.75"><title>back 0.01 ms</title></rect>
<text class="meta" x="12" y="392">speedups (same GET /board JSON, localhost): supabase rest 70 ms  -&gt;  local sqlite 1.6 ms  (43x). direct postgres sits in between (drop postgrest, keep network).</text>
<text class="meta" x="12" y="406">always-on js/sqlite ~1.6 ms vs cold process spawn p50 12.7 ms (~8x tax for bring-up; vercel cold starts are the same idea)</text>
<text class="meta" x="12" y="420">rewriting the query in c did not beat warm node+sqlite on this laptop; dropping remote rest + keeping a warm process did.</text>
</svg>