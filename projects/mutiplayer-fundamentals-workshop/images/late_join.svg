<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Late join with a snapshot</title>
  <desc id="desc">A new client connects, loads the arena and sends a ready RPC to the server. The server builds a snapshot of the entire current state: match timer, scores, who is It, player positions, health and inventory, and remaining pickups. It sends late_join_snapshot to that client only over a reliable channel. The new client applies the snapshot, is now in sync, and receives deltas from then on.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <g stroke="#9a9a9a" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow)">
    <line x1="400" y1="92" x2="400" y2="149"/>
    <line x1="400" y1="304" x2="400" y2="361"/>
  </g>

  <g fill="#e4e4e4">
    <rect x="143" y="23" width="520" height="72" rx="8"/>
    <rect x="143" y="155" width="520" height="152" rx="8"/>
    <rect x="143" y="367" width="520" height="72" rx="8"/>
  </g>
  <g stroke-width="2">
    <rect x="140" y="20" width="520" height="72" rx="8" fill="#fff" stroke="#222"/>
    <rect x="140" y="152" width="520" height="152" rx="8" fill="#222" stroke="#222"/>
    <rect x="140" y="364" width="520" height="72" rx="8" fill="#fff" stroke="#222"/>
  </g>

  <g fill="#333" stroke="#555" stroke-width="1">
    <rect x="156" y="214" width="158" height="32" rx="6"/>
    <rect x="321" y="214" width="158" height="32" rx="6"/>
    <rect x="486" y="214" width="158" height="32" rx="6"/>
    <rect x="156" y="256" width="158" height="32" rx="6"/>
    <rect x="321" y="256" width="158" height="32" rx="6"/>
    <rect x="486" y="256" width="158" height="32" rx="6"/>
  </g>
  <circle cx="367" cy="174" r="4" fill="#e00"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" dominant-baseline="central">
    <g font-size="12" font-weight="700" letter-spacing="1.5">
      <text x="400" y="40" fill="#888">NEW CLIENT</text>
      <text x="406" y="174" fill="#fff">SERVER</text>
      <text x="400" y="384" fill="#888">NEW CLIENT</text>
    </g>

    <g font-size="16" fill="#222">
      <text x="400" y="66">connects and loads the arena</text>
      <text x="400" y="410">apply snapshot &#8594; <tspan fill="#1f8a4c" font-weight="700">in sync</tspan> &#8594; deltas from here on</text>
    </g>

    <text x="400" y="196" font-size="13" fill="#aaa">builds a snapshot of the entire current state</text>

    <g font-size="13" fill="#eee">
      <text x="235" y="230">match timer</text>
      <text x="400" y="230">scores</text>
      <text x="565" y="230">who is It</text>
      <text x="235" y="272">player positions</text>
      <text x="400" y="272">health &amp; inventory</text>
      <text x="565" y="272">remaining pickups</text>
    </g>

    <g text-anchor="start">
      <text x="416" y="112" font-size="14" font-weight="700" fill="#222">&quot;I'm ready&quot;</text>
      <text x="416" y="132" font-size="12" fill="#888">RPC &#183; client &#8594; server</text>
      <text x="416" y="324" font-size="14" font-weight="700" fill="#222">late_join_snapshot(...)</text>
      <text x="416" y="344" font-size="12" fill="#888">reliable RPC &#183; server &#8594; new client only</text>
    </g>
  </g>
</svg>
