<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" width="820" height="170">
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #151515; }
    .t { font-size: 15px; font-weight: 600; }
    .m { fill: #6f6a60; font-size: 12px; }
    .h { fill: #ff4a1c; }
    .inv { fill: #f3f0e8; }
    .box { fill: #f3f0e8; stroke: #151515; stroke-width: 1.5; }
    .srv { fill: #151515; }
    .ln { stroke: #151515; stroke-width: 1.5; }
    .lh { stroke: #ff4a1c; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#151515"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff4a1c"/></marker>
  </defs>

  <rect class="box" x="1" y="20" width="168" height="130"/>
  <text class="t" x="16" y="48">browser</text>
  <line class="ln" x1="1" y1="62" x2="169" y2="62"/>
  <text x="16" y="88">GET /api/hello</text>

  <line class="ln" x1="174" y1="72" x2="314" y2="72" marker-end="url(#a)"/>
  <text class="m" x="244" y="64" text-anchor="middle">HTTP request</text>
  <line class="ln" x1="314" y1="108" x2="174" y2="108" marker-end="url(#a)"/>
  <text class="m" x="244" y="126" text-anchor="middle">HTTP response</text>

  <rect class="srv" x="320" y="20" width="170" height="130"/>
  <text class="t inv" x="335" y="48">web server</text>
  <line stroke="#f3f0e8" stroke-width="1" x1="320" y1="62" x2="490" y2="62"/>
  <text class="inv" x="335" y="88">:80</text>

  <line class="lh" x1="495" y1="72" x2="634" y2="72" marker-end="url(#ah)"/>
  <text class="m h" x="565" y="64" text-anchor="middle">HTTP request</text>
  <line class="lh" x1="634" y1="108" x2="495" y2="108" marker-end="url(#ah)"/>
  <text class="m h" x="565" y="126" text-anchor="middle">HTTP response</text>

  <rect class="box" x="640" y="20" width="179" height="130"/>
  <text class="t" x="655" y="48">app server</text>
  <line class="ln" x1="640" y1="62" x2="819" y2="62"/>
  <text class="m" x="655" y="88">127.0.0.1:3000</text>
  <text class="h" x="655" y="110">GET /hello</text>
  <text class="m" x="655" y="132">200 {"hi":1}</text>
</svg>
